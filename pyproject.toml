[project]
name = "yacy-near-anticipate"
version = "1.0.0"
description = "Yacy NEAR - Anticipate: backend proof-of-concept for proactive out-of-stock substitution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
